name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches manifest.json
        run: |
          version=$(jq -r .version custom_components/backrest/manifest.json)
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}"
            exit 1
          }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made by hand in the GitHub UI also pushes the tag; then
        # there is nothing left to do.
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          fi
