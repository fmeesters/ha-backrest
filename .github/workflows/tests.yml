name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Type check
        run: mypy custom_components
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=95
